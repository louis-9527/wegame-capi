## mongodb
spring:
  data:
    mongodb:
      dynamic:
        maria_makiling_mdb:
          db: makiling
          uri: mongodb://localhost:27017/makiling?maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=300000&waitQueueTimeoutMS=1000&connectTimeoutMS=1000&socketTimeoutMS=30000&heartbeatFrequencyMS=15000&minHeartbeatFrequencyMS=10000&compressors=zlib&retryWrites=false
          primary_uri: mongodb://localhost:27017/makiling?maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=300000&waitQueueTimeoutMS=1000&connectTimeoutMS=1000&socketTimeoutMS=30000&heartbeatFrequencyMS=15000&minHeartbeatFrequencyMS=10000&compressors=zlib&retryWrites=false&readPreference=primary
## pulsar
pulsar:
  dynamic:
    maria_makiling:
      url: pulsar://pulsar.makillingslot.net:6650
      tenant: ${spring.application.name}_MariaMakiling
      namespace: ${spring.application.env}
      bet_topic: MariaMakiling_topic
      bet_deadLetter_topic: MariaMakiling_deadLetter_topic