## mongodb
spring:
  data:
    mongodb:
      dynamic:
        maria_makiling_mdb:
          db: makiling
          uri: mongodb://localhost:27017/makiling
          primary_uri: mongodb://localhost:27017/makiling
## pulsar
pulsar:
  dynamic:
    maria_makiling:
      url: pulsar://pulsar.makillingslot.net:6650
      tenant: ${spring.application.name}_MariaMakiling
      namespace: ${spring.application.env}
      bet_topic: MariaMakiling_topic
      bet_deadLetter_topic: MariaMakiling_deadLetter_topic