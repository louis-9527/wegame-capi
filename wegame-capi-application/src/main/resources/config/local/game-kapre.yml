## pulsar
pulsar:
  dynamic:
    kapre:
      url: pulsar://pulsar.makillingslot.net:6650
      tenant: ${spring.application.name}_Kapre
      namespace: ${spring.application.env}
      bet_topic: Kapre_topic
      bet_deadLetter_topic: Kapre_deadLetter_topic