## mongodb
spring:
  data:
    mongodb:
      dynamic:
        bayanihan_mdb:
          db: bayanihan
          uri: mongodb://localhost:27017/bayanihan?maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=300000&waitQueueTimeoutMS=1000&connectTimeoutMS=1000&socketTimeoutMS=30000&heartbeatFrequencyMS=15000&minHeartbeatFrequencyMS=10000&compressors=zlib&retryWrites=false
          primary_uri: mongodb://localhost:27017/bayanihan?maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=300000&waitQueueTimeoutMS=1000&connectTimeoutMS=1000&socketTimeoutMS=30000&heartbeatFrequencyMS=15000&minHeartbeatFrequencyMS=10000&compressors=zlib&retryWrites=false&readPreference=primary
## pulsar
pulsar:
  dynamic:
    bayanihan:
      url: pulsar://qat-pulsar-proxy.cpegame.com:6650
      tenant: ${spring.application.name}_Bayanihan
      namespace: ${spring.application.env}
      bet_topic: Bayanihan_topic
      bet_deadLetter_topic: Bayanihan_deadLetter_topic