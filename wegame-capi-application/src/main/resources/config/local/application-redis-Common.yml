## spring:redis
spring:
  redis:
    connectTimeout: 1500
    timeout: 1500
    cluster:
      nodes:
        - localhost:7001
        - localhost:7002
        - localhost:7003
        - localhost:7004
        - localhost:7005
        - localhost:7006
      max-redirects: 3
    redisson:
      minIdlePoolSize: 0
      maxPoolSize: 1000
    lettuce:
      cluster:
        refresh:
          adaptive: true
          period: 3m
          dynamicRefreshSources: true
      pool:
        enabled: true
        #连接池中的最大空闲连接
        max-idle: 155
        #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 500
        #连接池最大连接数（使用负值表示没有限制）
        max-active: 155
        #连接池中的最小空闲连接
        min-idle: 155
        #间隔1个小时，驱逐空闲线程
        time-between-eviction-runs: 3600000
    password: qwe123!@#
    client-type: lettuce
#dynamic
dynamic:
  redisNodes:
    Common:
      - localhost:7001
      - localhost:7002
      - localhost:7003
      - localhost:7004
      - localhost:7005
      - localhost:7006
    Bayanihan:
      - prod-bayanihan-pri.redis.singapore.rds.aliyuncs.com:6379

