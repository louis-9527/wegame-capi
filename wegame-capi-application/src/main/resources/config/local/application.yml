appid: com.wegame.capi
## log
logging:
  level:
    org.apache.pulsar: DEBUG
#    org.springframework.web: trace
#    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
#    com.wegame: trace
#    org.apache.ibatis: trace
#    org.mongodb: DEBUG
#    org.springframework.data.redis: DEBUG
#    com.mongodb.internal.connection: DEBUG
#    org.apache.http: DEBUG
## server
server:
  port: 9500
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 10000
    max-connections: 110000
    keep-alive-timeout: 120000
    accept-count: 10000
    threads:
      max: 250000
      min-spare: 100
  servlet:
    context-path: /capi/game
    encoding:
      charset: UTF-8
      enabled: true
      force: true
## mybatis
mybatis:
  configuration:
    mapUnderscoreToCamelCase: true
    cacheEnabled: true
## spring
spring:
  application:
    name: wegame-capi
    env: local
  profiles:
    active: local
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  lifecycle:
    timeout-per-shutdown-phase: 90
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  freemarker:
    checkTemplateLocation: false
  redis:
    connectTimeout: 500
    timeout: 500
    cluster:
      nodes:
        - localhost:7001
        - localhost:7002
        - localhost:7003
        - localhost:7004
        - localhost:7005
        - localhost:7006
      max-redirects: 3
    redisson:
      minIdlePoolSize: 0
      maxPoolSize: 1000
    lettuce:
      cluster:
        refresh:
          adaptive: true
          period: 3m
          dynamicRefreshSources: true
      pool:
        enabled: true
        #连接池中的最大空闲连接
        max-idle: 155
        #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 500
        #连接池最大连接数（使用负值表示没有限制）
        max-active: 155
        #连接池中的最小空闲连接
        min-idle: 155
        #间隔1个小时，驱逐空闲线程
        time-between-eviction-runs: 3600000
    password: qwe123!@#
    client-type: lettuce
  datasource:
    dynamic:
      # 设置默认的数据源或者数据源组
      primary: wegame_user_db
      strict: true
      datasource:
        wegame_user_db:
          url: jdbc:mysql://localhost:3306/wegame_user_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&useAffectedRows=TRUE
          username: root
          password: ENC(YNkAqtiSqYCkHLUlQcUkJwinsDrTnnxC/q5p2JRLGozqSGKFeap13wRM9BiqQYFXpRtIEWfKVZug+LSFFvd3JQ==)
          public-key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKDugBIm/9xWXyM4pb/FgyCLC7qZhMzGm4T7sIZ3Faq2/ueVLPkJ5scHUUrdGNph3OTEwxSQGb4EDvvP2xSruAsCAwEAAQ==
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 10
            min-idle: 10
            max-active: 2000
            max-wait: 1000
            time-between-eviction-runs-millis: 6000
            min-evictable-idle-time-millis: 30001
