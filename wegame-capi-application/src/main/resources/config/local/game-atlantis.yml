## mongodb
spring:
  data:
    mongodb:
      dynamic:
        atlantis_mdb:
          db: atlantis
          uri: mongodb://localhost:27017/atlantis?maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=300000&waitQueueTimeoutMS=1000&connectTimeoutMS=1000&socketTimeoutMS=30000&heartbeatFrequencyMS=15000&minHeartbeatFrequencyMS=10000&compressors=zlib&retryWrites=false
          primary_uri: mongodb://localhost:27017/atlantis?maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=300000&waitQueueTimeoutMS=1000&connectTimeoutMS=1000&socketTimeoutMS=30000&heartbeatFrequencyMS=15000&minHeartbeatFrequencyMS=10000&compressors=zlib&retryWrites=false&readPreference=primary
## pulsar
pulsar:
  dynamic:
    atlantis:
      url: pulsar://pulsar.makillingslot.net:6650
      tenant: ${spring.application.name}_Atlantis
      namespace: ${spring.application.env}
      bet_topic: Atlantis_topic
      bet_deadLetter_topic: Atlantis_deadLetter_topic