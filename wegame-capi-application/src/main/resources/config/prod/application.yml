appid: com.wegame.capi
## log
logging:
  level:
    com.wegame: info
    org.mongodb: error
## server
server:
  port: 9500
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 1000
    max-connections: 15000
    keep-alive-timeout: 120000
    accept-count: 5000
    threads:
      max: 2000
      min-spare: 1000
  servlet:
    context-path: /capi/game
    encoding:
      charset: UTF-8
      enabled: true
      force: true
## mybatis
mybatis:
  configuration:
    mapUnderscoreToCamelCase: true
    cacheEnabled: true
## spring
spring:
  application:
    name: wegame-capi
    env: prod
  profiles:
    active: prod
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  lifecycle:
    timeout-per-shutdown-phase: 90
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  freemarker:
    checkTemplateLocation: false
  redis:
    connectTimeout: 500
    timeout: 500
    cluster:
      nodes:
        - prod-makiling-redis-sg.7odqjm.clustercfg.apse1.cache.amazonaws.com:6379
      max-redirects: 3
    redisson:
      minIdlePoolSize: 50
      maxPoolSize: 500
    lettuce:
      cluster:
        refresh:
          adaptive: true
          period: 30m
          dynamicRefreshSources: true
      pool:
        enabled: true
        #连接池中的最小空闲连接
        min-idle: 100
        #连接池中的最大空闲连接
        max-idle: 100
        #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 10
        #连接池最大连接数（使用负值表示没有限制）
        max-active: 1000
        #间隔1个小时，驱逐空闲线程
        time-between-eviction-runs: 3600000
    password:
    client-type: lettuce
  datasource:
    dynamic:
      primary: wegame_user_db
      strict: true
      datasource:
        wegame_user_db:
          url: jdbc:mysql://prod-makiling-mysql-sg.cluster-cnidxkef2jeq.ap-southeast-1.rds.amazonaws.com:3306/wegame_user_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&useAffectedRows=TRUE
          username: PROD_Makiling_Service_User
          password: ENC(QdOoUQKWq8Sg7gyhwSLhK1Gf2UH3ZoNIMKyBqMSlYLv4FOrByxPHoT1xoLnyOH9Ts1vrzTbAnhDlm33b4/3vxA==)
          public-key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKDugBIm/9xWXyM4pb/FgyCLC7qZhMzGm4T7sIZ3Faq2/ueVLPkJ5scHUUrdGNph3OTEwxSQGb4EDvvP2xSruAsCAwEAAQ==
          driver-class-name: com.mysql.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 250
            min-idle: 50
            max-active: 500
            max-wait: 1000
            time-between-eviction-runs-millis: 6000
            min-evictable-idle-time-millis: 30001
            validation-query: SELECT 1 FROM DUAL
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
            pool-prepared-statements: false
        wegame_backend_db:
