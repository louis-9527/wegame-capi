## spring:redis
spring:
  redis:
    connectTimeout: 500
    timeout: 500
    cluster:
      nodes:
        - prod-makiling-redis-sg.7odqjm.clustercfg.apse1.cache.amazonaws.com:6379
      max-redirects: 3
    redisson:
      minIdlePoolSize: 50
      maxPoolSize: 500
    lettuce:
      cluster:
        refresh:
          adaptive: true
          period: 30m
          dynamicRefreshSources: true
      pool:
        enabled: true
        #连接池中的最小空闲连接
        min-idle: 100
        #连接池中的最大空闲连接
        max-idle: 100
        #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 10
        #连接池最大连接数（使用负值表示没有限制）
        max-active: 1000
        #间隔1个小时，驱逐空闲线程
        time-between-eviction-runs: 3600000
    password:
    client-type: lettuce