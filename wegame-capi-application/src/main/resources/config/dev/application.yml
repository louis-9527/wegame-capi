appid: com.wegame.capi
## server
server:
  port: 9500
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 3000
    max-connections: 2000000
    keep-alive-timeout: 180000
    accept-count: 100
    threads:
      max: 300000
      min-spare: 20
  servlet:
    context-path: /capi/game
    encoding:
      charset: UTF-8
      enabled: true
      force: true
## mybatis
mybatis:
  configuration:
    mapUnderscoreToCamelCase: true
    cacheEnabled: true
## spring
spring:
  application:
    name: wegame-capi
    env: dev
  profiles:
    active: dev
  config:
    import:
      - application-datasource.yml
      - application-redis.yml
      - game-common.yml
      - game-maria_makiling.yml
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  lifecycle:
    timeout-per-shutdown-phase: 90
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  freemarker:
    checkTemplateLocation: false
## fastjson
fastjson:
  parser:
    safeMode: true
## knife4j
knife4j:
  enable: true
  production: false
  openapi:
    title: 接口文档
    description: "接口文档"
    version: v1.0.0
