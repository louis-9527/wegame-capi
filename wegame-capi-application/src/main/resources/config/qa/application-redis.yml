## spring:redis
spring:
  redis:
    connectTimeout: 1500
    timeout: 1500
    cluster:
      nodes:
        - 43.199.119.200:7001
        - 43.199.119.200:7002
        - 43.199.119.200:7003
        - 43.199.119.200:7004
        - 43.199.119.200:7005
        - 43.199.119.200:7006
      max-redirects: 5
    redisson:
      minIdlePoolSize: 250
      maxPoolSize: 1000
