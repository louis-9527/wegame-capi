## spring:redis
spring:
  redis:
    connectTimeout: 1500
    timeout: 1500
    cluster:
      nodes:
        - qat-makiling-pri.redis.singapore.rds.aliyuncs.com:6379
      max-redirects: 5
    redisson:
      minIdlePoolSize: 250
      maxPoolSize: 1000
    lettuce:
      pool:
        enabled: true
        #连接池中的最大空闲连接
        max-idle: 20
        #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 500
        #连接池最大连接数（使用负值表示没有限制）
        max-active: 1000
        #连接池中的最小空闲连接
        min-idle: 2
    password:
    client-type: lettuce