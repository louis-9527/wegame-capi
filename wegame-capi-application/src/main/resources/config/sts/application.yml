## rocketmq
rocketmq:
  #  consumer:
  #    group: boxing_pay_out_group
  #    # 一次拉取消息最大值，注意是拉取消息的最大值而非消费最大值
  #    pull-batch-size: 10
  name-server: rmq-qat-livsports-rocketmq-system-nameserver.rocketmq-system.svc:9876
  producer:
    # 发送同一类消息的设置为同一个group，保证唯一
    group: test_group
    # 发送消息超时时间，默认3000
    sendMessageTimeout: 10000
    # 发送消息失败重试次数，默认2
    retryTimesWhenSendFailed: 2
    # 异步消息重试此处，默认2
    retryTimesWhenSendAsyncFailed: 2
    # 消息最大长度，默认1024 * 1024 * 4(默认4M)
    maxMessageSize: 4096
    # 压缩消息阈值，默认4k(1024 * 4)
    compressMessageBodyThreshold: 4096
    # 是否在内部发送失败时重试另一个broker，默认false
    retryNextServer: false

