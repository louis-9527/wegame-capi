appid: com.wegame.capi
## log
logging:
  level:
    org.springframework.web: info
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    com.wegame: info
    org.apache.ibatis: info
    com.alibaba.nacos: info
    com.alibaba.cloud.nacos: DEBUG
## server
server:
  port: 9500
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 3000
    max-connections: 10000
    keep-alive-timeout: 3000
    accept-count: 100
    threads:
      max: 20000
      min-spare: 20
  servlet:
    context-path: /capi/game
    encoding:
      charset: UTF-8
      enabled: true
      force: true
## mybatis
mybatis:
  configuration:
    mapUnderscoreToCamelCase: true
    cacheEnabled: true
## spring
spring:
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  lifecycle:
    timeout-per-shutdown-phase: 30
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  freemarker:
    checkTemplateLocation: false
  redis:
    connectTimeout: 1500
    timeout: 1500
    cluster:
      nodes:
        - qat-livsport-platform-redis-hk.rhphvv.clustercfg.ape1.cache.amazonaws.com:6379
      max-redirects: 5
    lettuce:
      pool:
        #连接池中的最大空闲连接
        max-idle: 20
        #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 500
        #连接池最大连接数（使用负值表示没有限制）
        max-active: 100
        #连接池中的最小空闲连接
        min-idle: 2
