appid: com.wegame.capi
## server
server:
  port: 9500
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 1000
    max-connections: 15000
    keep-alive-timeout: 120000
    accept-count: 5000
    threads:
      max: 2000
      min-spare: 1000
  servlet:
    context-path: /capi/game
    encoding:
      charset: UTF-8
      enabled: true
      force: true
## mybatis
mybatis:
  configuration:
    mapUnderscoreToCamelCase: true
    cacheEnabled: true
## spring
spring:
  application:
    name: wegame-capi
    env: sts
  profiles:
    active: sts
  config:
    import:
      - application-datasource.yml
      - application-redis.yml
      - application-elasticsearch.yml
      - game-common.yml
      - game-maria_makiling.yml
      - game-malakas.yml
      - game-ibong.yml
      - game-lamang.yml
      - game-bakunawa.yml
      - game-diwata_mayari.yml
      - game-kapre.yml
      - game-mangkukulam.yml
      - game-sirena.yml
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  lifecycle:
    timeout-per-shutdown-phase: 90
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  freemarker:
    checkTemplateLocation: false
## fastjson
fastjson:
  parser:
    safeMode: true
## knife4j
knife4j:
  enable: true
  production: false
  openapi:
    title: 接口文档
    description: "接口文档"
    version: v1.0.0
#lark
lark:
  publishRobot: 7614441b-3ea3-4b6e-9e53-6aa1feff2b31
  warningRobot: b2ff5555-4320-4c50-bfb5-5955cf1b6005
  shutDownRobot: b9807c8f-9abf-449b-852a-0b180f6e288d
