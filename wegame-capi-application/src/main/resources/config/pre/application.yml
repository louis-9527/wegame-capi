appid: com.wegame.capi
## log
logging:
  level:
    org.springframework.web: info
    org.springframework.data.mongodb.core.MongoTemplate: info
    com.wegame: info
    org.apache.ibatis: info
## server
server:
  port: 9500
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 3000
    max-connections: 100000
    keep-alive-timeout: 3000
    accept-count: 10000
    threads:
      max: 200000
      min-spare: 20
  servlet:
    context-path: /capi/game
    encoding:
      charset: UTF-8
      enabled: true
      force: true
## mybatis
mybatis:
  configuration:
    mapUnderscoreToCamelCase: true
    cacheEnabled: true
## spring
spring:
  application:
    name: wegame-capi
    env: pre
  profiles:
    active: pre
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  lifecycle:
    timeout-per-shutdown-phase: 30
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  freemarker:
    checkTemplateLocation: false
  redis:
    connectTimeout: 500
    timeout: 500
    cluster:
      nodes:
        - uat-livsport-platform-redis-hk.k4h6cn.clustercfg.ape1.cache.amazonaws.com:6379
      max-redirects: 5
    lettuce:
      pool:
        #连接池中的最大空闲连接
        max-idle: 10
        #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 500
        #连接池最大连接数（使用负值表示没有限制）
        max-active: 8
        #连接池中的最小空闲连接
        min-idle: 0
    password:
  datasource:
    dynamic:
      primary: wegame_user_db
      strict: true
      datasource:
        wegame_user_db:
          url: jdbc:mysql://uat-livsport-platform-mysql-hk.cluster-cmi9oiggthxz.ap-east-1.rds.amazonaws.com:3306/wegame_user_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&useAffectedRows=TRUE
