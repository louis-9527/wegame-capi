// 目标
sink {
    Doris {
        fenodes = "10.167.67.5:9030"
        username = "QATmakilingDoris_service"
        password = "zbI60Ra51PJglogwKl"
        database = "lamang"
        table = "${table_name}"
        batch_size = 1
        schema_save_mode = "RECREATE_SCHEMA"
        data_save_mode = "APPEND_DATA"
        save_mode_create_template = """
            CREATE TABLE IF NOT EXISTS lamang.${table_name} (
                ${rowtype_fields}
            )
            UNIQUE KEY(`_id`)
            DISTRIBUTED BY HASH(`_id`) BUCKETS 1
            PROPERTIES (
                "enable_unique_key_merge_on_write" = "true",
                "replication_num" = "1"
            );
        """
        doris.config {
            format = "json"
            read_json_by_line = "true"
        }
    }
