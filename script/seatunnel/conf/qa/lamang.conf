    # 假设 MongoDB 表结构和 Doris 表结构基本一致，可省略转换操作
}

sink {
#    Console {
#        parallelism = 1
#    }
    Doris {
        fenodes = "10.147.68.89:8031"
        query-port = 9031
        username = "QATmakiling_Doris_Service"
        password = "gNIFe0zzbC4U7D24h3L"
        database = "lamang"
        table = "${table_name}"
        schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
        data_save_mode = "APPEND_DATA"
        "sink.label-prefix" = "mongodb2doris_lamang_product"  # 优化：增加唯一性标识
        "sink.buffer-size" = 524288 # 用于缓存stream load数据的缓冲区大小。默认值 256*1024
        "sink.buffer-count" = 6 # 用于缓存stream load数据的缓冲区计数。默认值 3
        "doris.batch.size" = 1  # 每次http请求写入doris的批量大小，当row达到该大小或者执行checkpoint时，缓存的数据就会写入服务器。默认值 1024
        save_mode_create_template="""
        CREATE TABLE IF NOT EXISTS `${database}`.`${table}` (
           ${rowtype_fields}
        )
        UNIQUE KEY(${rowtype_primary_key})
        COMMENT '${comment}'
        DISTRIBUTED BY HASH(${rowtype_primary_key}) BUCKETS 10
        PROPERTIES (
            "replication_allocation" = "tag.location.default: 1",
            "enable_unique_key_merge_on_write" = "true"
        );
        """
        stream_load {
            format = "json"
            read_json_by_line = true
            timeout = 300000
            max_retries = 3
            retry_interval = 10000
        }
        doris.config {
            format="json"
            strict_mode = "false"
        }
    }
}