env {
    // You can set engine configuration here
    parallelism = 1
    job.mode = "STREAMING"
    checkpoint.interval = 5000
}

// 数据源
source {
    MongoDB-CDC {
        hosts = "127.0.0.1:27017"
        database = ["makiling"]
        collection = [
            "makiling.mariamakiling_bet_record",
            "makiling.mariamakiling_game_record",
            "makiling.mariamakiling_operation_event",
            "makiling.mariamakiling_operation_event_config",
            "makiling.mariamakiling_operation_event_config_record",
            "makiling.mariamakiling_operation_event_detail",
            "makiling.mariamakiling_star_card_use_record.txt",
            ]
        tables_configs = [
            {
                schema {
                    table = "makiling.mariamakiling_bet_record"
                    fields {
                        _id = LONG
                        pId = STRING
                        channelId = STRING
                        gameId = STRING
                        userId = LONG
                        playerId = STRING
                        playerName = STRING
                        betType = STRING
                        betSubType = STRING
                        betPromotionType = INT
                        betId = STRING
                        betSerialNo = STRING
                        betAmount = LONG
                        payAmount = LONG
                        reachMaxMultiple = BOOLEAN
                        payOutAmount = LONG
                        marketFlag = INT
                        status = INT
                        betTime = LONG
                        extendInfo = {
                            ieId = STRING,
                            rewardUrl = STRING,
                            campaignId = STRING
                        }
                        creator = STRING
                        createTime = LONG
                        updater = STRING
                        updateTime = LONG
                    }
                }
            },
            {
                schema {
                    table = "makiling.mariamakiling_game_record"
                    fields {
                        _id = LONG
                        parentId = LONG
                        batchId = LONG
                        betRecordId = LONG
                        playerId = STRING
                        playerName = STRING
                        index = INT
                        freeWheelFlag = BOOLEAN
                        wheel = {
                            index = INT
                            freeFlag = BOOLEAN
                            symbolArr = ARRAY<STRING>
                        }
                        rewardResult = {
                            betAmount = LONG
                            rewardType = STRING
                            rewardSubType = STRING
                            totalRewardAmount = LONG
                            totalMultiple = STRING
                            hasRewardFreeWheel = BOOLEAN
                            rewardFreeWheelTimes = INT
                        }
                        gameRecordIds = ARRAY<LONG>
                        accumulateReachMaxMultiple = BOOLEAN
                        lastGameFlag = BOOLEAN
                        overallRewardAmount = LONG
                    }
                }
            },
            {
                schema {
                    table = "makiling.mariamakiling_operation_event"
                    fields {
                       _id = LONG
                       eventId = STRING
                       playerName = STRING
                       bonus = LONG
                       minBonus = LONG
                       maxBonus = LONG
                       finishBonus = LONG
                       eventKind = INT
                       gameId = STRING
                       channelId = STRING
                       effectedTime = LONG
                       expiredTime = LONG
                       eventStatus = INT
                       eventSubStatus = INT
                       reportStatus = INT
                       eventMsgDetail = STRING
                       reportFailMsg = STRING
                       reportTime = LONG
                       createTime = LONG
                       updateTime = LONG
                   }
                }
            },
            {
                schema {
                    table = "makiling.mariamakiling_operation_event_config"
                    fields {
                        _id = LONG
                        gameId = STRING
                        betType = STRING
                        multiple = DOUBLE
                   }
                }
            },
            {
                schema {
                    table = "makiling.mariamakiling_operation_event_config_record"
                    fields {
                        _id = LONG
                        parentId = LONG
                        batchId = LONG
                        betRecordId = LONG
                        index = INT
                        gameRecordIds = ARRAY<LONG>
                        wheel = STRING  # 映射为STRING类型，存储JSON字符串
                        extInfo = STRING  # 映射为STRING类型，存储JSON字符串
                   }
                }
            },
            {
                schema {
                    table = "makiling.mariamakiling_operation_event_detail"
                    fields {
                        _id = LONG
                        operatorRecordId = LONG
                        eventId = STRING
                        operatorGameId = STRING
                        configId = LONG
                        playerId = STRING
                        playerName = STRING
                        userId = STRING
                        betAmount = LONG
                        payOutAmount = LONG
                        eventAmount = LONG
                        payOutTime = LONG
                        betTime = LONG
                        betId = STRING
                        betRecordId = LONG
                        betStatus = INT
                        channelId = STRING
                        gameId = STRING
                        createTime = LONG
                        updateTime = LONG
                   }
                }
            },
            {
                schema {
                    table = "makiling.mariamakiling_star_card_record"
                    fields {
                        _id = LONG
                        rewardId = STRING
                        rewardConfigId = STRING
                        gameId = STRING
                        channelId = STRING
                        betRecordId = LONG
                        playerId = STRING
                        playName = STRING
                        betAmount = LONG
                        payOutAmount = LONG
                        useStatus = INT
                        failMsg = STRING
                        failCode = INT
                        reportStatus = INT
                        createTime = LONG
                        updateTime = LONG
                   }
                }
            }
        ]
    }
}

transform {
    // 这里可以添加数据转换操作，比如对不同数据源的数据进行字段映射、类型转换等
    // 假设 MongoDB 表结构和 Doris 表结构基本一致，可省略转换操作
}

// 目标
sink {
    Doris {
        fenodes = "127.0.0.1:8030"
        username = root
        password = "rootroot"
        database = "wegame"
        table = "${table_name}"
        batch_size = 1
        schema_save_mode = "RECREATE_SCHEMA"
        data_save_mode = "APPEND_DATA"
        save_mode_create_template = """
            CREATE TABLE IF NOT EXISTS wegame.${table_name} (
                ${rowtype_fields}
            )
            UNIQUE KEY(`_id`)
            DISTRIBUTED BY HASH(`_id`) BUCKETS 1
            PROPERTIES (
                "enable_unique_key_merge_on_write" = "true",
                "replication_num" = "1"
            );
        """
        doris.config {
            format = "json"
            read_json_by_line = "true"
        }
    }
}