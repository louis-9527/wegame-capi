name: "CodeQL Scan"

on: #workflow_dispatch, job will only execute while being triggered
  workflow_dispatch:


jobs:
  analyze:
    name: Analyze
    runs-on: [AMD]
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    
    steps:
    - name: Checkout project
      uses: actions/checkout@v4
    
    - name: Init CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you want to specify a custom code scanning config file, you can do so here.
    
    - name: Install Maven and build manually
      run: |
        sudo apt-get update
        sudo apt-get install -y maven

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      with:
        build-command: 'mvn clean package -Pqa -DskipTests'
      #with:
        # If you want to use a custom build command, you can specify it here.
        # build-command: 'mvn clean package -P${{ github.event.inputs.env }} -DskipTests'
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: true
        token: ${{ secrets.CODESCAN_SECRET }}
