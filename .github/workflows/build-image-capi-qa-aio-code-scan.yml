# documentation.###

name: CodeGuru CodeScan # actions name will appear during triggered

on: #workflow_dispatch, job will only execute while being triggered
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to deploy to'
        required: false
        default: 'qa'
      version:
        required: true
        default: 'latest'
      deployment:
        required: true

jobs:
  image-scan:
    runs-on: [AMD] #tag that match with your github-runner
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write

    env: 
      AWS_REGION: ap-southeast-1
      IMAGE_URI: 438465153243.dkr.ecr.ap-southeast-1.amazonaws.com/wegame-capi:4.1.19
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TEST_OIDC }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CodeGuru Reviewer
        uses: aws-actions/codeguru-reviewer@v1.1
        with:
          s3_bucket: codeguru-reviewer-438465153243-ap-southeast-1

      - name: Upload review result
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codeguru-results.sarif.json # Your results file will be named codeguru-security-results.sarif.json

      # - name: Fail job if vulnerability threshold is exceeded
      #   run: exit ${{ steps.inspector.outputs.vulnerability_threshold_exceeded }}

