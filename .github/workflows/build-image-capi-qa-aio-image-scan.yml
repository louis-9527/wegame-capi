# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.###

name: Java CI with Maven All in One (ImageScan) # actions name will appear during triggered

on: #workflow_dispatch, job will only execute while being triggered
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to deploy to'
        required: false
        default: 'qa'
      version:
        required: true
        default: 'latest'
      deployment:
        required: true

jobs:
  build-push-deploy-All-in-One:
    runs-on: [ARM] #tag that match with your github-runner
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          check-latest: true

      - name: Install Maven
        run: |
          ls -la
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Prepare Maven cache directory
        run: |
          sudo mkdir -p /opt/maven/repo
          sudo chown -R $(whoami):$(whoami) /opt/maven
          sudo chmod -R u+rwX /opt/maven

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: /opt/maven/repo
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ runner.arch }}-
            
      - name: Build with Maven
        run: |
          rm -rf /opt/maven/repo/com/wegame
          mvn --version
          sudo cp ./settings.xml /usr/share/maven/conf/settings.xml
          mvn clean package -P${{ github.event.inputs.env }} -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
        with:
          role-to-assume: ${{ secrets.OIDC_IAM_ROLE }}
          aws-region: ap-southeast-1

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: 438465153243.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 438465153243.dkr.ecr.ap-southeast-1.amazonaws.com/wegame-capi:${{ github.event.inputs.version }}
          provenance: false
      
      - name: Time Wait
        run: sleep 10

      - name: Scan built image with Inspector
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@v1
        with:
          artifact_type: 'container'
          artifact_path: '438465153243.dkr.ecr.ap-southeast-1.amazonaws.com/wegame-capi:${{ github.event.inputs.version }}'
          display_vulnerability_findings: "enabled"
          critical_threshold: 1
          high_threshold: 1
          medium_threshold: 1
          low_threshold: 1
          other_threshold: 1

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: Inspector Vulnerability Scan Artifacts
          path: |
            ${{ steps.inspector.outputs.inspector_scan_results }}
            ${{ steps.inspector.outputs.inspector_scan_results_csv }}
            ${{ steps.inspector.outputs.artifact_sbom }}
            ${{ steps.inspector.outputs.inspector_scan_results_markdown }}

      # - name: Fail job if vulnerability threshold is exceeded
      #   run: exit ${{ steps.inspector.outputs.vulnerability_threshold_exceeded }}

      - name: Clone repo
        run: |
          git clone https://git:${TOKEN}@github.com/sre-snsoft/Mysterious-Slots-QAT.git
          cd Mysterious-Slots-QAT
          sed -i "s|image: 438465153243.*|image: 438465153243.dkr.ecr.ap-southeast-1.amazonaws.com/wegame-capi:${{ github.event.inputs.version }}|g" deployment/templates/wegame-capi.yml
        env:
          TOKEN: ${{ github.event.inputs.deployment }}

      - name: Deploy to QA
        run: |
          cd Mysterious-Slots-QAT
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          sh -x gitpush.sh "Deploy CAPI version ${{ github.event.inputs.version }} to QA"
